<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boîte à idées — AG des personnels</title>
  <link rel="stylesheet" href="style.css">
  <script src="menu.js" defer></script>
</head>
<body>

<!--
  =====================================================================
  PAGE : BOÎTE À IDÉES
  ---------------------------------------------------------------------
  Les idées sont déposées via un formulaire en ligne (ex. Framaforms,
  Google Forms), qui peut être anonyme.

  À FAIRE UNE FOIS :
    remplacez l'adresse https://exemple.fr/boite-a-idees par le lien
    de votre formulaire.

  Ensuite, on peut recopier ici les idées reçues : une ligne <li> par idée.
  =====================================================================
-->

<main id="contenu">

  <h1>Boîte à idées</h1>
  <p class="chapeau">[À compléter : phrase d'introduction]</p>

  <section class="encadre">
    <h2>Déposer une idée</h2>
    <p>[À compléter : explication (anonyme ou non, durée...)]</p>
    <!-- Remplacez l'adresse après href= par le lien de votre formulaire -->
    <p><a class="bouton" href="https://exemple.fr/boite-a-idees">Ouvrir le formulaire</a></p>
  </section>

  <!-- Idées reçues et ce qu'il en est advenu. Une ligne <li> par idée. -->
  <h2>Idées reçues</h2>
  <ul>
    <li><strong>[À compléter : idée]</strong> — [À compléter : suite donnée]</li>
  </ul>

  <p class="mise-a-jour">Dernière mise à jour : [À compléter]</p>

</main>

</body>
</html>
