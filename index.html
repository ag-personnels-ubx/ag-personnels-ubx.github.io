<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Titre affiché dans l'onglet du navigateur -->
  <title>Accueil — AG des personnels</title>
  <link rel="stylesheet" href="style.css">
  <!-- menu.js ajoute automatiquement le bandeau, le menu et le pied de page -->
  <script src="menu.js" defer></script>
</head>
<body>

<!--
  =====================================================================
  PAGE D'ACCUEIL : LA PROCHAINE AG
  ---------------------------------------------------------------------
  COMMENT MODIFIER CETTE PAGE (à lire une fois) :
  - Ce qui est entre <!- - et - -> est un commentaire : il ne s'affiche pas,
    il sert seulement à expliquer.
  - Le texte visible se trouve ENTRE les balises, par exemple :
        <p>Ceci est un paragraphe.</p>
        <li>Ceci est un élément de liste</li>
    On peut changer librement le texte, mais il faut garder les balises
    (<p> ... </p>, etc.) autour.
  - <strong>texte</strong> met le texte en gras.
  - Remplacez chaque [À compléter] par votre texte.

  APRÈS UNE AG :
    1. ajoutez son résumé sur la page ag-precedentes.html ;
    2. revenez ici et remplacez les infos par celles de l'AG suivante.
  =====================================================================
-->

<main id="contenu">

  <h1>Prochaine AG</h1>

  <!-- ============ DATE, HEURE, LIEU ============ -->
  <section class="encadre">
    <dl class="infos">
      <dt>Date</dt>  <dd>[À compléter]</dd>
      <dt>Heure</dt> <dd>[À compléter]</dd>
      <dt>Lieu</dt>  <dd>[À compléter]</dd>
    </dl>
  </section>

  <!-- ============ ORDRE DU JOUR ============
       Une ligne <li> ... </li> par point. Ajoutez ou supprimez des lignes. -->
  <h2>Ordre du jour</h2>
  <ol>
    <li>[À compléter]</li>
    <li>[À compléter]</li>
  </ol>

  <!-- ============ INFOS PRATIQUES ============
       Accès, visio, garde d'enfants, pause méridienne... Une ligne <li> par info.
       Supprimez toute cette partie (du <h2> au </ul>) si elle ne sert pas. -->
  <h2>Infos pratiques</h2>
  <ul>
    <li>[À compléter]</li>
  </ul>

  <!-- ============ AG SUIVANTES ============
       Dates déjà prévues pour les AG d'après. Une ligne <li> par AG. -->
  <h2>AG suivantes</h2>
  <ul>
    <li>[À compléter : date — lieu]</li>
  </ul>

  <!-- Pensez à changer cette date à chaque modification -->
  <p class="mise-a-jour">Dernière mise à jour : [À compléter]</p>

</main>

</body>
</html>
