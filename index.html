<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Titre affiché dans l'onglet du navigateur -->
  <title>Accueil — AG des personnels</title>
  <link rel="stylesheet" href="style.css">
  <!-- menu.js ajoute automatiquement le bandeau, le menu et le pied de page -->
  <script src="menu.js" defer></script>
</head>
<body>

<!--
  =====================================================================
  PAGE D'ACCUEIL : LA PROCHAINE AG
  ---------------------------------------------------------------------
  COMMENT MODIFIER CETTE PAGE (à lire une fois) :
  - Ce qui est entre <!- - et - -> est un commentaire : il ne s'affiche pas,
    il sert seulement à expliquer.
  - Le texte visible se trouve ENTRE les balises, par exemple :
        <p>Ceci est un paragraphe.</p>
        <li>Ceci est un élément de liste</li>
    On peut changer librement le texte, mais il faut garder les balises
    (<p> ... </p>, etc.) autour.
  - <strong>texte</strong> met le texte en gras.
  - Remplacez chaque [À compléter] par votre texte.

  APRÈS UNE AG :
    1. ajoutez son résumé sur la page ag-precedentes.html ;
    2. revenez ici et remplacez les infos par celles de l'AG suivante.
  =====================================================================
-->

<main id="contenu">

  <h1>Prochaine AG</h1>

  <!-- ============ DATE, HEURE, LIEU ============ -->
  <section class="encadre">
    <dl class="infos">
      <dt>Date</dt>  <dd>Mardi 1er décembre</dd>
      <dt>Heure</dt> <dd>12h</dd>
      <dt>Lieu</dt>  <dd>Bâtiment A9 (amphi infos à venir)</dd>
    </dl>
  </section>

  <!--
  =====================================================================
  Affiche
  ---------------------------------------------------------------------

  POUR METTRE L'AFFICHE :
    1. Enregistrez l'affiche en image (.jpg ou .png) et nommez-la
       exactement : affiche-fonctionnement.jpg
       (ou .png : dans ce cas, changez aussi la fin du nom plus bas).
    2. Sur GitHub, ouvrez le dossier "images" > "Add file" > "Upload files",
       déposez l'image, puis "Commit changes".
    Pour la remplacer plus tard : déposez une nouvelle image avec le même
    nom, elle remplace l'ancienne.

  SI L'AFFICHE EST UN PDF :
    déposez-la dans "images" sous le nom affiche-fonctionnement.pdf,
    et le lien "Télécharger l'affiche" en dessous de l'image fonctionnera
    (vous pouvez alors supprimer la ligne <img ... >).
  =====================================================================
-->

  <h1>Fonctionnement des AG</h1>
  <p class="chapeau">Comment se déroule une AG?</p>

  <!-- L'affiche. "alt" = texte lu par les lecteurs d'écran ou affiché si l'image manque. -->
  <p>
    <img src="images/affiche-fonctionnement.jpg"
         alt="Affiche expliquant le fonctionnement des AG (à venir)">
  </p>

  <!-- Lien de téléchargement : adaptez la fin du nom (.jpg, .png ou .pdf) -->
  <p><a href="images/affiche-fonctionnement.jpg">Télécharger l'affiche</a></p>



  <!-- Pensez à changer cette date à chaque modification -->
  <p class="mise-a-jour">Dernière mise à jour : 26/11/2026</p>

</main>

</body>
</html>
